name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install gjs and Qt's runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gjs libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install PySide6 (QML integration tests)
        run: pip install PySide6-Essentials

      - name: Run every test
        run: PYTHON=python tests/run.sh
